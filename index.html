<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dernier Rempart – Jeu de tir zombie gratuit</title>
<meta name="description" content="Tenez le pont ! Tirez à travers les portes pour agrandir votre escouade et repoussez la horde de zombies.">

<!-- ===== GOOGLE ADSENSE (remplacez ca-pub-XXXXXXXXXXXXXXXX par VOTRE ID éditeur) =====
     Retirez data-adbreak-test="on" une fois votre site approuvé. -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
        data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-adbreak-test="on" crossorigin="anonymous"></script>
<script>
  window.adsbygoogle = window.adsbygoogle || [];
  window.adBreak = window.adConfig = function (o) { adsbygoogle.push(o); };
  adConfig({ preloadAdBreaks: 'on', sound: 'on' });
</script>

<style>
  :root{--bg:#14181f;--road:#3a4150;--accent:#ffb020;--danger:#e5484d;--ok:#3ecf8e;--ink:#f2f4f8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;overflow:hidden;touch-action:none;user-select:none}
  #app{display:flex;flex-direction:column;align-items:center;height:100%;padding-top:env(safe-area-inset-top,0)}
  #banner{flex:0 0 52px;display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;background:#0c0f14}
  #stage{position:relative;flex:1;width:100%;min-height:0;display:flex;justify-content:center;align-items:center}
  canvas{height:100%;max-width:100%;aspect-ratio:9/16;background:#222}
  #ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:rgba(10,12,16,.82)}
  #ov[hidden]{display:none}
  #ov h1{margin:0;font-size:clamp(30px,8vw,44px);line-height:1.05;letter-spacing:.5px;color:var(--accent);text-shadow:0 3px 0 #7a4a00}
  #ov p{margin:0;max-width:300px;font-size:16px;line-height:1.45;color:#cfd5e0}
  button{font:inherit;font-weight:700;font-size:18px;padding:13px 26px;min-width:230px;border:0;border-radius:14px;background:var(--accent);color:#2a1a00;box-shadow:0 4px 0 #a86a00;cursor:pointer}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #a86a00}
  button.alt{background:#2b6cff;color:#fff;box-shadow:0 4px 0 #1741a0}
  button:focus-visible{outline:3px solid #fff;outline-offset:2px}
  #msg{min-height:20px;font-size:14px;color:var(--danger)}
</style>
</head>
<body>
<div id="app">
  <!-- Bannière AdSense (hors zone de jeu, conforme aux règles). Remplacez data-ad-slot. -->
  <div id="banner">
    <ins class="adsbygoogle" style="display:inline-block;width:320px;height:50px"
         data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="XXXXXXXXXX"></ins>
  </div>
  <div id="stage">
    <canvas id="c" width="360" height="640"></canvas>
    <div id="ov"></div>
  </div>
</div>

<script>
try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}

const cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');
const W = 360, H = 640, PY = 560, LEN = 32;
let S = 'menu', lv = 1, coins = 0, n = 1, dmg = 1, px = W / 2, tx = W / 2, cd = 0, t = 0, zt = 0, gt = 2, shake = 0, boss = null, adBusy = false;
let bul = [], zs = [], gs = [], ps = [], last = 0;
const FR = 0.26, ri = (a, b) => Math.floor(a + Math.random() * (b - a + 1));

/* ---------- Publicités ---------- */
function ad(type, name, onDone, onReward) {
  if (adBusy) return; adBusy = true;
  let done = false;
  const finish = (ok) => { if (done) return; done = true; adBusy = false; onDone(ok); };
  const timer = setTimeout(() => finish(false), 2500);   // pas de pub dispo → on continue
  const o = {
    type, name,
    beforeAd() { S = 'pause'; },
    afterAd() { clearTimeout(timer); },
    adBreakDone(info) { clearTimeout(timer); finish(info && info.breakStatus === 'viewed'); }
  };
  if (type === 'reward') {
    o.beforeReward = (show) => { clearTimeout(timer); show(); };
    o.adViewed = () => { onReward && onReward(); };
  }
  adBreak(o);
}

/* ---------- Écrans ---------- */
function screen(title, text, btns, msg) {
  ov.hidden = false;
  ov.innerHTML = `<h1>${title}</h1><p>${text}</p><div id="msg">${msg || ''}</div>`;
  btns.forEach(([label, cls, fn]) => {
    const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls;
    b.onclick = fn; ov.appendChild(b);
  });
}
function menu() {
  S = 'menu';
  screen('Dernier Rempart', 'Glissez le doigt pour déplacer votre escouade. Tirez sur les portes bleues pour les améliorer, évitez les rouges, et écrasez la horde !',
    [['Jouer', '', () => start(1)]]);
}
function start(l) {
  lv = l; n = 3; dmg = 1; t = 0; zt = 0; gt = 2; boss = null; bul = []; zs = []; gs = []; ps = []; cd = 0; px = tx = W / 2;
  ov.hidden = true; S = 'play'; last = performance.now();
}
function lose() {
  S = 'over';
  screen('Le pont est tombé', `Niveau ${lv} · ${coins} pièces`, [
    ['Revivre (vidéo)', 'alt', () => ad('reward', 'revive', (ok) => {
        if (ok) { n = 8; zs = zs.filter(z => z.y < 250); ov.hidden = true; S = 'play'; last = performance.now(); }
        else { S = 'over'; screen('Pub indisponible', 'Aucune vidéo disponible pour le moment. Réessayez plus tard.', [['Rejouer', '', () => start(lv)]]); }
      })],
    ['Rejouer', '', () => ad('next', 'retry', () => start(lv))]
  ]);
}
function win() {
  S = 'win';
  screen('Niveau ' + lv + ' réussi !', `Le boss est tombé. ${coins} pièces collectées.`, [
    ['Niveau suivant', '', () => ad('next', 'level-' + lv, () => start(lv + 1))]
  ]);
}

/* ---------- Génération ---------- */
function gateDef() {
  const r = Math.random();
  if (r < .34) return { type: 'n', v: ri(2, 8) };
  if (r < .54) return { type: 'x', v: ri(2, 3) };
  if (r < .70) return { type: 'd', v: 1 };
  return { type: 'n', v: -ri(2, 6) };
}
function spawnGate() {
  gs.push(Object.assign({ x: 4, w: 170, y: -50, h: 44 }, gateDef()), Object.assign({ x: 186, w: 170, y: -50, h: 44 }, gateDef()));
}
function spawnZ(boss_) {
  if (boss_) { boss = { x: W / 2, y: -60, r: 44, hp: 120 * lv, max: 120 * lv, sp: 11, boss: 1 }; zs.push(boss); return; }
  const hp = Math.round(2 + lv * 1.4 + Math.random() * 2);
  zs.push({ x: ri(24, W - 24), y: -20, r: 14, hp, max: hp, sp: 32 + lv * 2 + Math.random() * 16 });
}
function boom(x, y, c, k = 8) { for (let i = 0; i < k; i++) ps.push({ x, y, vx: (Math.random() - .5) * 220, vy: (Math.random() - .5) * 220, l: .5, c }); }

/* ---------- Boucle ---------- */
function update(dt) {
  t += dt; px += (tx - px) * Math.min(1, dt * 14);
  cd -= dt;
  if (cd <= 0) {
    cd = FR; const k = Math.min(n, 14), sp = Math.min(16, 200 / k), mult = Math.max(1, n / k);
    for (let i = 0; i < k; i++) bul.push({ x: px + (i - (k - 1) / 2) * sp, y: PY - 14, d: dmg * mult });
  }
  if (t < LEN) {
    zt -= dt;
    if (zt <= 0) { zt = Math.max(.3, 1.05 - lv * .05 - t / LEN * .35); for (let i = ri(1, 2 + (lv > 2)); i > 0; i--) spawnZ(); }
    gt -= dt; if (gt <= 0 && t < LEN - 6) { gt = 7; spawnGate(); }
  } else if (!boss) spawnZ(true);

  bul.forEach(b => b.y -= 560 * dt);
  bul = bul.filter(b => b.y > -10);

  gs.forEach(g => {
    g.y += 62 * dt;
    if (!g.done && g.y + g.h >= PY - 12) {
      g.done = true;
      if (px >= g.x && px <= g.x + g.w) {
        if (g.type === 'n') n += g.v; else if (g.type === 'x') n *= g.v; else dmg += .5;
        n = Math.min(80, Math.floor(n)); boom(px, PY, g.v < 0 && g.type === 'n' ? '#e5484d' : '#3ecf8e', 14);
        if (g.v < 0 && g.type === 'n') shake = .25;
      }
    }
  });
  gs = gs.filter(g => g.y < H + 20);

  for (const b of bul) {
    for (const g of gs) if (g.type === 'n' && !g.done && b.x > g.x && b.x < g.x + g.w && b.y > g.y && b.y < g.y + g.h) { g.v += 1; b.dead = 1; break; }
    if (b.dead) continue;
    for (const z of zs) if (Math.hypot(b.x - z.x, b.y - z.y) < z.r + 4) { z.hp -= b.d; b.dead = 1; z.flash = .06; boom(b.x, b.y, '#9be26b', 2); break; }
  }
  bul = bul.filter(b => !b.dead);

  for (const z of zs) {
    z.y += z.sp * dt; if (z.flash) z.flash -= dt;
    if (z.hp <= 0) { z.dead = 1; coins += z.boss ? 50 : 1; boom(z.x, z.y, z.boss ? '#ffb020' : '#7fbf4a', z.boss ? 40 : 8); if (z.boss) { setTimeout(win, 700); S = 'bossdead'; } }
    else if (z.y > PY - 10) { z.dead = 1; n -= z.boss ? 999 : 1; shake = .3; boom(z.x, PY, '#e5484d', 10); }
  }
  zs = zs.filter(z => !z.dead);
  if (n <= 0 && S === 'play') lose();
  ps.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.l -= dt; }); ps = ps.filter(p => p.l > 0);
  if (shake > 0) shake -= dt;
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * 8, (Math.random() - .5) * 8);
  ctx.fillStyle = '#10151d'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#3a4150'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#566074'; ctx.fillRect(0, 0, 3, H); ctx.fillRect(W - 3, 0, 3, H);
  ctx.fillStyle = '#4a5265'; const off = (t * 60) % 60;
  for (let y = -60 + off; y < H; y += 60) ctx.fillRect(W / 2 - 2, y, 4, 28);

  gs.forEach(g => {
    const bad = g.type === 'n' && g.v < 0;
    ctx.fillStyle = bad ? 'rgba(229,72,77,.55)' : g.type === 'd' ? 'rgba(255,176,32,.55)' : 'rgba(43,108,255,.55)';
    ctx.fillRect(g.x, g.y, g.w, g.h);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(g.x, g.y, g.w, g.h);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 26px Trebuchet MS'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(g.type === 'x' ? '×' + g.v : g.type === 'd' ? 'Dégâts +' : (g.v > 0 ? '+' : '') + g.v, g.x + g.w / 2, g.y + g.h / 2 + 1);
  });

  zs.forEach(z => {
    ctx.fillStyle = z.flash ? '#fff' : z.boss ? '#9c3b2e' : '#6fae45';
    ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, 7); ctx.fill();
    ctx.fillStyle = '#e5484d'; const e = z.r * .32;
    ctx.beginPath(); ctx.arc(z.x - e, z.y - e * .5, z.r * .14, 0, 7); ctx.arc(z.x + e, z.y - e * .5, z.r * .14, 0, 7); ctx.fill();
    if (z.boss || z.hp < z.max) {
      ctx.fillStyle = '#000'; ctx.fillRect(z.x - z.r, z.y - z.r - 10, z.r * 2, 5);
      ctx.fillStyle = '#e5484d'; ctx.fillRect(z.x - z.r, z.y - z.r - 10, z.r * 2 * Math.max(0, z.hp / z.max), 5);
    }
  });

  ctx.fillStyle = '#ffd76a'; bul.forEach(b => ctx.fillRect(b.x - 1.5, b.y - 6, 3, 12));

  const k = Math.min(n, 14), sp = Math.min(16, 200 / k);
  for (let i = 0; i < k; i++) {
    const x = px + (i - (k - 1) / 2) * sp, y = PY + (i % 2) * 10;
    ctx.fillStyle = '#2b6cff'; ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#f0c9a0'; ctx.beginPath(); ctx.arc(x, y - 3, 5, 0, 7); ctx.fill();
    ctx.fillStyle = '#222'; ctx.fillRect(x - 1.5, y - 20, 3, 12);
  }
  ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Trebuchet MS'; ctx.textAlign = 'center';
  ctx.fillText('×' + n, px, PY + 34);

  ps.forEach(p => { ctx.globalAlpha = Math.max(0, p.l * 2); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 4, 4); }); ctx.globalAlpha = 1;
  ctx.restore();

  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, W, 34);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Trebuchet MS'; ctx.textBaseline = 'middle';
  ctx.textAlign = 'left'; ctx.fillText('Niveau ' + lv, 10, 17);
  ctx.textAlign = 'right'; ctx.fillStyle = '#ffb020'; ctx.fillText(coins + ' ●', W - 10, 17);
  ctx.fillStyle = '#222'; ctx.fillRect(100, 13, 160, 8);
  ctx.fillStyle = '#3ecf8e'; ctx.fillRect(100, 13, 160 * Math.min(1, t / LEN), 8);
}

function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (S === 'play' || S === 'bossdead') update(dt);
  draw(); requestAnimationFrame(loop);
}

/* ---------- Contrôles ---------- */
function setX(cx) { const r = cv.getBoundingClientRect(); tx = Math.max(20, Math.min(W - 20, (cx - r.left) / r.width * W)); }
cv.addEventListener('pointerdown', e => { setX(e.clientX); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') setX(e.clientX); });
addEventListener('keydown', e => { if (e.key === 'ArrowLeft') tx = Math.max(20, tx - 40); if (e.key === 'ArrowRight') tx = Math.min(W - 20, tx + 40); });
document.addEventListener('visibilitychange', () => { last = performance.now(); });

menu(); requestAnimationFrame(loop);
</script>
</body>
</html>
